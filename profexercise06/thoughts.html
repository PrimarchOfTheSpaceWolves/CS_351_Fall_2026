<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
                content="width=device-width, initial-scale=1.0">
        <title>Thoughts</title>
        <script src="js/classic.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Thoughts</h1>
        </header>
        <main>   
            <script type="module">
                import {greet} from "./js/utils.js";
                const params = new URLSearchParams(window.location.search);
                let fullName = params.get("name");
                console.log(greet(fullName));
            </script>
            <script>
                console.log("Thoughts BEFORE:", 
                    document.getElementById("thoughts"));
            </script>
            <p id="thoughts"></p>
            <script>
                console.log("Thoughts AFTER:", 
                    document.getElementById("thoughts"));
            </script>
        </main>
    </body>
</html>
