            <script type="module">
                import * as util from "./js/utils.js";

                const params = new URLSearchParams(window.location.search);
                let fullName = params.get("name");
                let age = params.get("age");
                let height = params.get("height");
                const terms = params.get("terms");
                const isShouting = params.has("shouting");
              
                // Process full name
                fullName = util.processFullName(fullName);
                console.log(util.greet(fullName));
                
                // Age calculations                
                console.log("Age before:", age, typeof age);
                age = Number(age);
                console.log("Age after:", age, typeof age);

                let yearOfBirth = util.calculateBirthYear(age);
                
                const person = {
                    name: fullName,
                    age: Number(age),
                    yearOfBirth,
                    termsAccepted: params.has("terms"),
                }

                function buildThoughts(person, shouting) {
                    let birthString = person.name + " was born in " 
                                    + person.yearOfBirth + ".";

                    let ancientString = "";
                    if(person.age > 200) {
                        ancientString = "  JEEPERS, YOU'RE ANCIENT.";
                    }

                    let renString = "";
                    if(util.checkInRenaissance(person.yearOfBirth)) {
                        renString = "  You are born in the Renaissance.";
                    }
                    
                    let termsString = "";
                    if(!person.termsAccepted) {
                        termsString = "  Aw man, there goes my retirement.";
                    }

                    // Compile final output
                    let finalString = birthString + ancientString + termsString + renString;
                    if(shouting) {
                        finalString = finalString.toUpperCase();
                    }

                    return finalString;
                }
              
                
                document.getElementById("thoughts").textContent
                 = buildThoughts(person, isShouting);

            </script>
