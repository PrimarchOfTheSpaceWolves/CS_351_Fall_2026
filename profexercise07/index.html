<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
                content="width=device-width, initial-scale=1.0">
        <title>Personal Data</title>
    </head>
    <body>
        <header>
            <h1>Personal Data</h1>
        </header>
        <main>           
            <form action="thoughts" method="get">
                <div class="form-element">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="form-element">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age">     
                </div> 
                
                <div class="form-element">
                    <label for="favorites">Favorite Foods:</label>
                    <input type="text" id="favorites" name="favorites">
                </div>
                
                <div class="form-element">
                    <input type="checkbox" id="terms" name="terms">
                    <label for="terms">By checking this box, you accept
                        all terms and conditions, and we can sell your
                        information on the web to make great profit.
                    </label>
                </div>

                <div class="form-element">
                    <input type="checkbox" id="shouting" name="shouting">
                    <label for="shouting">Shouting?</label>
                </div>

                <div class="form-element">
                    <input type="checkbox" id="student" name="student">
                    <label for="student">Student?</label>
                </div>

                <div id="majorSection" class="form-element" hidden>
                    <label for="major">Major:</label>
                    <input type="text" id="major" name="major" disabled>
                </div>

                <script type="module">
                    const section = document.getElementById("majorSection");
                    const student = document.getElementById("student");
                    const major = document.getElementById("major");

                    function updateStudent() {
                        section.hidden = !student.checked;
                        major.disabled = !student.checked;
                    }

                    student.addEventListener("change", updateStudent);
                    window.addEventListener("pageshow", updateStudent);
                </script>

                <div class="submit-area">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </main>
    </body>
</html>
